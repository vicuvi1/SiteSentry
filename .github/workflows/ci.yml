name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff mypy
      - name: Ruff (style, bugs, security rules)
        run: ruff check . --output-format github
      - name: Mypy (static types)
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install and smoke-test the CLI
        run: |
          pip install .
          sitesentry --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t sitesentry .
      - name: Smoke-test image (runs as non-root)
        run: |
          docker run --rm sitesentry --version
          test "$(docker run --rm --entrypoint id sitesentry -u)" != "0"
          docker run --rm sitesentry --help | grep -q -- "--serve"
