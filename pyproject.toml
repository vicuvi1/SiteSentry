[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitesentry"
version = "1.2.0"
description = "Passive website security scanner with a web UI: HTTPS, TLS, security headers, cookies, CORS and information leaks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Victor Barbuta" }]
dependencies = []

[project.optional-dependencies]
certs = ["certifi"]  # Mozilla CA bundle: consistent certificate results on every OS
keywords = ["security", "scanner", "tls", "http-headers", "owasp", "appsec"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
  "Environment :: Web Environment",
]

[project.urls]
Homepage = "https://vicuvi1.github.io/SiteSentry/"
Source = "https://github.com/vicuvi1/SiteSentry"

[project.scripts]
sitesentry = "sitesentry.cli:main"

[tool.setuptools]
packages = ["sitesentry", "sitesentry.checks"]

[tool.setuptools.package-data]
sitesentry = ["ui/*.html"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "A"]
ignore = [
  "S101",  # assert is fine in tests
  "S311",  # random is only used for DNS query IDs, not secrets
  "UP007", # keep Optional-style unions readable for 3.9-era readers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802", "B011"]

[tool.mypy]
python_version = "3.11"
files = ["sitesentry"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["certifi"]
ignore_missing_imports = true
